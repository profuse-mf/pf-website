<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100">
  <!-- Purple background -->
  <rect width="220" height="100" rx="14" fill="#6B3FA0"/>
  <!-- White pill -->
  <rect x="14" y="22" width="192" height="56" rx="28" fill="white"/>
  <!-- "ack" text in purple -->
  <text x="30" y="68" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="42" font-weight="900" fill="#6B3FA0" letter-spacing="-1">ack</text>
  <!-- Green filled "o" -->
  <circle cx="178" cy="50" r="24" fill="#4CAF50"/>
  <!-- White inner ring of "o" to give donut effect -->
  <circle cx="178" cy="50" r="14" fill="white"/>
  <!-- Green center dot -->
  <circle cx="178" cy="50" r="6" fill="#4CAF50"/>
</svg>
